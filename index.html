<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Chess</title>
  <meta name="description" content="Space Chess — chess in orbit, with black holes, a wormhole and computer opponents.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Main menu -->
  <main id="menu" class="screen">
    <header class="hero">
      <div class="logo" aria-hidden="true"><span class="b">♞&#xFE0E;</span><span class="p">♚&#xFE0E;</span></div>
      <h1>Space <span>Chess</span></h1>
      <p class="sub">Chess in orbit. Steer clear of the black holes, ride the wormhole, and fly off one edge of the board to come back on the other.</p>
    </header>
    <nav class="main-menu">
      <button id="btn-play" class="primary big">Play</button>
      <button id="btn-rules" class="big">Rules</button>
    </nav>
  </main>

  <!-- Game -->
  <div id="game" class="screen hidden">
    <div class="topbar">
      <button id="btn-menu" class="ghost">← Menu</button>
      <h2 id="game-title"></h2>
      <div class="spacer"></div>
    </div>
    <div class="layout">
      <div id="stage" class="stage">
        <div id="board-wrap" class="board-wrap">
          <div id="board" class="board"></div>
          <div class="edge edge-front"></div>
        </div>
      </div>
      <aside class="panel">
        <div id="status" class="status"></div>
        <ul id="player-list" class="players"></ul>
        <div class="controls">
          <button id="btn-undo">↶ Undo</button>
          <button id="btn-restart">↻ Restart</button>
          <button id="btn-rotl" title="Rotate view left">⟲</button>
          <button id="btn-rotr" title="Rotate view right">⟳</button>
        </div>
        <label class="tilt">3D tilt <input id="tilt" type="range" min="0" max="60" value="45"></label>
        <h3>Moves</h3>
        <ol id="move-log" class="log"></ol>
      </aside>
    </div>
  </div>

  <!-- Dialogs -->
  <div id="overlay" class="overlay hidden">
    <div id="dialog" class="dialog card"></div>
  </div>

  <script type="module" src="js/ui.js"></script>
</body>
</html>
